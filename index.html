<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>StudentForge | Student Tools</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #172033;
    }

    /* NAVBAR */
    nav {
      background: #ffffff;
      padding: 18px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5e7eb;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .logo span {
      color: #2563eb;
    }

    nav a {
      text-decoration: none;
      color: #555;
      margin-left: 20px;
    }

    /* HERO */
    .hero {
      text-align: center;
      padding: 70px 20px 45px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero h1 span {
      color: #2563eb;
    }

    .hero p {
      color: #64748b;
      font-size: 17px;
    }

    /* TOOLS */
    .tools {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .tools h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 28px;
      border-radius: 14px;
      border: 1px solid #e5e7eb;
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    .card h3 {
      margin-bottom: 10px;
    }

    .card p {
      color: #64748b;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    button {
      border: none;
      background: #2563eb;
      color: white;
      padding: 11px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #1d4ed8;
    }

    /* CALCULATOR */
    .calculator {
      max-width: 500px;
      margin: 50px auto;
      background: white;
      padding: 30px;
      border-radius: 14px;
      border: 1px solid #e5e7eb;
    }

    .calculator h2 {
      margin-bottom: 10px;
    }

    .calculator p {
      color: #64748b;
      margin-bottom: 20px;
    }

    .subject {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: #eef4ff;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      display: none;
    }

    footer {
      text-align: center;
      padding: 40px 20px;
      color: #64748b;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 32px;
      }

      nav {
        padding: 15px 5%;
      }

      nav a {
        display: none;
      }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav>
    <div class="logo">
      Student<span>Forge</span>
    </div>

    <div>
      <a href="#tools">Tools</a>
      <a href="#cgpa">CGPA</a>
    </div>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <h1>Student tools, <span>made simple.</span></h1>

    <p>
      Useful tools to help students manage college life better.
    </p>
  </section>

  <!-- TOOLS -->
  <section class="tools" id="tools">

    <h2>Student Tools</h2>

    <div class="cards">

      <div class="card">
        <h3>📊 CGPA Calculator</h3>

        <p>
          Calculate your CGPA quickly using your semester grades.
        </p>

        <button onclick="document.getElementById('cgpa').scrollIntoView()">
          Open Calculator
        </button>
      </div>

      <div class="card">
        <h3>📅 Attendance Calculator</h3>

        <p>
          Find out your attendance percentage and plan your classes.
